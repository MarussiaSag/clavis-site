name: Deploy to production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database for build
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=accept-new"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo connected && pwd"

      - name: Upload release
        timeout-minutes: 25
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new"
          SCP_OPTS="-i ~/.ssh/deploy_key -P ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=60 -o StrictHostKeyChecking=accept-new"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          DEPLOY="${{ secrets.DEPLOY_PATH }}"

          echo "Creating release archive..."
          tar -czf release.tar.gz -C .next/standalone .

          echo "Uploading archive ($(du -h release.tar.gz | cut -f1))..."
          scp ${SCP_OPTS} release.tar.gz "${TARGET}:${DEPLOY}/release.tar.gz"

          echo "Extracting on server..."
          ssh ${SSH_OPTS} "${TARGET}" "cd '${DEPLOY}' && tar -xzf release.tar.gz && rm -f release.tar.gz"

          echo "Uploading restart script..."
          ssh ${SSH_OPTS} "${TARGET}" "mkdir -p '${DEPLOY}/scripts'"
          scp ${SCP_OPTS} scripts/server-restart.sh "${TARGET}:${DEPLOY}/scripts/server-restart.sh"

      - name: Restart app on server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new"
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash '${{ secrets.DEPLOY_PATH }}/scripts/server-restart.sh'"
